<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCForge</title>
    <script>
      (() => {
        const segments = window.location.pathname.split('/').filter(Boolean)
        const base = segments[0]?.toLowerCase() === 'pcforge' ? `/${segments[0]}` : ''
        const route = window.location.pathname.slice(base.length).replace(/^\/+/, '')
        const query = window.location.search ? `&${window.location.search.slice(1)}` : ''
        window.location.replace(`${base}/?/${encodeURIComponent(route)}${query}${window.location.hash}`)
      })()
    </script>
  </head>
  <body></body>
</html>
