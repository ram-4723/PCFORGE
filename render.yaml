services:
  - type: web
    name: pcforge-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # This service is a payment-test deployment. The backend's guard only
      # enables these sample products when MONGODB_URI targets pcforge_test.
      - key: SPRING_PROFILES_ACTIVE
        value: test-catalog
      - key: FRONTEND_ORIGINS
        value: https://ram-4723.github.io
      - key: PCFORGE_SEED_DEMO
        value: "false"
      - key: PCFORGE_TEST_CATALOG_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
